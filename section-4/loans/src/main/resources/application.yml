spring:
  application:
    name: loans

  datasource:
    url: jdbc:mysql://localhost:3307/accountsdb
    username: root
    password: root

  jpa:
    show-sql: true

  profiles:
    active:
      - "qa"
  sql:
    init:
      mode: always
  config:
    import:
      - "optional:configserver:http://localhost:8071/"

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"